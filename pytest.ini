[pytest]
# Garde-fou anti-HANG (P1.1, 2026-07-22). Tout test dépassant `timeout` secondes est INTERROMPU avec
# un dump de la stack de tous les threads, au lieu de bloquer la suite indéfiniment. Né du calvaire de
# chasse-au-hang : deux tests bloquaient `pytest -m "not slow"` (async_logger.stop() sans borne, puis un
# smoke lourd mal marqué), chacun trouvé à la main en ~13 min. Avec ce garde-fou, un futur hang FAILE
# vite en nommant le coupable.
#
# `timeout_method = thread` est OBLIGATOIRE sous Windows (pas de SIGALRM) : sur timeout, pytest-timeout
# dumpe les stacks puis termine le process (comme faulthandler_timeout). Un test légitimement LENT
# (> ~120 s) doit être marqué `@pytest.mark.slow` (désélectionné en CI rapide) ; pour lancer la suite
# lente sans être coupé : `pytest -m slow --timeout=0`. Override par-test : `@pytest.mark.timeout(N)`.
timeout = 120
timeout_method = thread

name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:

jobs:
  # ------------------------------------------------------------------------------------------------
  # PORTAIL METHODOLOGIQUE. Les cliquets du depot ne tournaient QUE dans le hook pre-commit local :
  # un `--no-verify`, une autre machine ou un push depuis ailleurs les contournait sans un mot. C'est
  # la classe E10 a l'echelle du depot -- des regles executables qu'aucun portail n'executait.
  # Rapide et sans monde : aucun de ces cliquets ne simule, aucun ne prend le bail `kuzu`.
  # ------------------------------------------------------------------------------------------------
  garde-methodologique:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install minimal deps
        # ⚠️ `psutil` (tools/jobs/doctor, garde de bail) et `pyyaml` (consolidate_records, graphe)
        # sont des dependances TRANSITIVES : verifiees par analyse d'imports AVANT de pousser,
        # pas decouvertes sur un portail rouge.
        run: python -m pip install --upgrade pip && python -m pip install numpy pytest pytest-timeout psutil pyyaml

      - name: Graphe de records (orphelins, collisions, aretes ignorees)
        run: PYTHONIOENCODING=utf-8 python tools/check_record_links.py

      - name: Calibration des instruments (baseline a ZERO)
        run: PYTHONIOENCODING=utf-8 python tools/check_instrument_calibration.py

      - name: DV scellees effectivement mesurees
        run: PYTHONIOENCODING=utf-8 PYTHONPATH=. python tools/check_preregistration_applied.py

      - name: Gardes du registre (chacune nomme son contre-exemple)
        run: PYTHONIOENCODING=utf-8 python tools/check_guard_negative_cases.py

      - name: Fraicheur du backlog (liens morts, numeros doubles, chemins disparus)
        run: PYTHONIOENCODING=utf-8 python tools/check_backlog_freshness.py

      - name: Gardes-de-gardes (chaque cliquet doit pouvoir ECHOUER)
        run: >-
          PYTHONIOENCODING=utf-8 python -m pytest -q --timeout=300
          tests/sandbox/test_guard_negative_cases.py
          tests/sandbox/test_backlog_freshness.py
          tests/sandbox/test_lease_guard.py
          tests/sandbox/test_ablation_bounds_ratchet.py
          tests/sandbox/test_no_swallowed_assertions.py
          tests/sandbox/test_record_graph_completeness.py
          tests/sandbox/test_mutation_block_invariants.py
          tests/sandbox/test_mutation_index_invariants.py

  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r backend/requirements.txt

      - name: Run Python tests
        run: >-
          python -m pytest
          tests/test_backend.py
          tests/sandbox/test_visualization.py
          tests/test_observability.py
          tests/test_flatland_manager.py
          tests/test_strategy.py
          tests/test_sociologist.py
          tests/test_sandbox.py
          tests/test_security.py
          -q

      - name: Parity gate (narration EDR -> frontend)
        run: python tools/parity_check.py --strict

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: API types à jour (codegen OpenAPI -> TS)
        run: |
          PYTHONPATH=. python tools/dump_openapi.py
          npm --prefix frontend run gen:api
          git diff --exit-code -- frontend/openapi.json frontend/src/api/schema.ts

      - name: Run frontend unit tests
        run: npm run test
        working-directory: frontend

      - name: Run frontend build
        run: npm run build
        working-directory: frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend docker image
        run: docker build -f Dockerfile.backend -t agiseed-backend .

      - name: Build frontend docker image
        run: docker build -f Dockerfile.frontend -t agiseed-frontend .

      - name: Run docker compose and smoke test
        run: |
          docker compose up -d
          sleep 10
          curl --fail http://localhost:8000/health
          curl --fail http://localhost:4173
          # Install Playwright browsers and run E2E tests against the running services
          npm --prefix frontend install
          npm --prefix frontend exec -- playwright install --with-deps chromium
          npm --prefix frontend run test:e2e
          docker compose down

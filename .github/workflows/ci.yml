name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:

jobs:
  # ------------------------------------------------------------------------------------------------
  # PORTAIL METHODOLOGIQUE. Les cliquets du depot ne tournaient QUE dans le hook pre-commit local :
  # un `--no-verify`, une autre machine ou un push depuis ailleurs les contournait sans un mot. C'est
  # la classe E10 a l'echelle du depot -- des regles executables qu'aucun portail n'executait.
  # Rapide et sans monde : aucun de ces cliquets ne simule, aucun ne prend le bail `kuzu`.
  # ------------------------------------------------------------------------------------------------
  garde-methodologique:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install minimal deps
        # ⚠️ `psutil` (tools/jobs/doctor, garde de bail) et `pyyaml` (consolidate_records, graphe)
        # sont des dependances TRANSITIVES : verifiees par analyse d'imports AVANT de pousser,
        # pas decouvertes sur un portail rouge.
        # ⚠️ `jsonschema` (check_agi_taxonomy, porte 6) est importé PARESSEUSEMENT, dans la fonction qui valide
        # (ligne ~185) : l'analyse d'imports ci-dessus ne le voyait pas. La porte le DIT au lieu de valider en
        # silence — « [NOUVELLE VIOLATION] schéma NON vérifié : `jsonschema` absent » — et ce job était rouge
        # pour cette seule cause (runs 36154477100 et 36163823183 du 2026-09-25, mesuré par agagi-00).
        # ⚠️ `pydantic` : le pas « Cellules de CONTROLE » importe src.agents.mamba_agent → src/swarm/consensus.py:2.
        # Il était SAUTÉ sur chaque run depuis que le pas AGI-Taxonomy rougissait (jsonschema) ; jsonschema réparé,
        # il a tiré pour la première fois le 2026-09-26 (run 36210667429 : 3 failed / 17 passed, tous pydantic).
        # Un pas sauté est un pas qu'on ne mesure pas — le vert d'un job à pas SAUTÉS ne dit rien de ces pas.
        run: python -m pip install --upgrade pip && python -m pip install numpy pytest pytest-timeout psutil pyyaml jsonschema pydantic

      - name: Graphe de records (orphelins, collisions, aretes ignorees)
        run: PYTHONIOENCODING=utf-8 python tools/check_record_links.py

      - name: Calibration des instruments (baseline a ZERO)
        run: PYTHONIOENCODING=utf-8 python tools/check_instrument_calibration.py

      - name: DV scellees effectivement mesurees
        run: PYTHONIOENCODING=utf-8 PYTHONPATH=. python tools/check_preregistration_applied.py

      - name: Gardes du registre (chacune nomme son contre-exemple)
        run: PYTHONIOENCODING=utf-8 python tools/check_guard_negative_cases.py

      - name: Fraicheur du backlog (liens morts, numeros doubles, chemins disparus)
        run: PYTHONIOENCODING=utf-8 python tools/check_backlog_freshness.py

      # 2026-09-09 : la porte la plus STRICTE du depot (verdict X_DEMANDED obligatoire, plafond de
      # l'incapable numerique + provenance ecrite, barre au-dessus du plafond) ne tirait NULLE PART --
      # ni hook, ni CI, baseline inexistante. demands.json etait committable sans aucun controle.
      - name: AGI-Taxonomy (toute arete ETABLIE porte sa preuve complete)
        run: PYTHONIOENCODING=utf-8 python tools/check_agi_taxonomy.py

      # 2026-09-09 (P2.49) : une agregation qui rend une CONSTANTE sur une collection VIDE rend une
      # cohorte vide indiscernable d'une cohorte qui a survecu 0 tick. 121 sites legataires geles.
      - name: Defauts FABRIQUES (une collection vide n'est pas une mesure a zero)
        run: PYTHONIOENCODING=utf-8 python tools/check_fabricated_defaults.py

      # 2026-09-09 (P2.49) : ces 4 fichiers etaient ROUGES depuis l'armement de la garde de
      # degenerescence (2026-07-21) -- 8 tests affirmaient SURVIVAL_NEUTRAL la ou l'instrument rend
      # (a juste titre) INDETERMINE_DEGENERATE. Personne ne l'a su : aucun job de CI ne les lancait.
      # Rectifies puis branches ici, pour que le silence ne se reforme pas.
      - name: Cellules de CONTROLE des sondes de demande in-world
        run: >-
          PYTHONIOENCODING=utf-8 python -m pytest -q --timeout=600
          tests/test_cognitive_demand_world_probe.py
          tests/test_anticipation_demand_world_probe.py
          tests/test_composition_demand_world_probe.py
          tests/test_memory_demand_world_probe.py
          tests/test_openloop_probe.py

      # 2026-09-09 : le CLIQUET DES CLIQUETS. Les portes verifient le depot ; rien ne verifiait
      # qu'elles en sont toujours CAPABLES. Chaque porte est cassee d'UNE ligne, en memoire, et un
      # temoin doit rougir. ~4 min pour 13 portes / 16 mutations -- le seul job de ce workflow qui
      # lance des sous-processus pytest, d'ou sa place a la fin du portail.
      # ⚠️ `if: !cancelled()` sur les deux pas suivants (2026-09-26, mesuré par agagi-39 sur le run 36211007100) : ce
      # sont des MÉTA-GARDES — elles prouvent que les portes savent encore refuser. Sans la clause, le premier pas de
      # CONTENU rouge les faisait SAUTER : elles n'ont tourné sur AUCUN run de d1 tant que jsonschema, puis pydantic,
      # rougissaient avant elles. Le job reste rouge si un pas précédent l'est ; seul le SAUT disparaît.
      - name: Cliquet DES CLIQUETS (chaque porte prouve qu'elle sait ENCORE refuser)
        if: ${{ !cancelled() }}
        run: PYTHONIOENCODING=utf-8 python tools/check_gate_mutation.py

      - name: Gardes-de-gardes (chaque cliquet doit pouvoir ECHOUER)
        if: ${{ !cancelled() }}
        run: >-
          PYTHONIOENCODING=utf-8 python -m pytest -q --timeout=300
          tests/sandbox/test_guard_negative_cases.py
          tests/sandbox/test_backlog_freshness.py
          tests/sandbox/test_lease_guard.py
          tests/sandbox/test_ablation_bounds_ratchet.py
          tests/sandbox/test_no_swallowed_assertions.py
          tests/sandbox/test_record_graph_completeness.py
          tests/sandbox/test_mutation_block_invariants.py
          tests/sandbox/test_mutation_index_invariants.py
          tests/sandbox/test_agi_taxonomy_gate.py
          tests/sandbox/test_perimeter_widening.py
          tests/sandbox/test_fabricated_defaults.py

  # ------------------------------------------------------------------------------------------------
  # LA SUITE COMPLETE, PAR REPERTOIRE (2026-09-09). Tous les autres jobs prennent une LISTE NOMMEE de
  # fichiers -- 16 au total -- ce qui laissait 1937 tests sur 2059 (94 %) hors de toute CI. La
  # consequence n'est pas theorique : NEUF tests rouges dormaient dans ces fichiers, dont trois
  # fixtures d'AGI-Taxonomy perimees depuis deux durcissements de la porte, un test qui exigeait
  # `N_EMERGE_PAS` sur ZERO seed (un negatif FABRIQUE, gele par le test cense l'attraper), et un test
  # rendu rouge par un correctif du jour meme sans que rien ne le dise pendant 24 h.
  # Un test qui rougit sans temoin est une garde desarmee en silence -- E22 applique a la CI.
  #
  # COUT MESURE, machine dont la charge est connue : 2611 tests collectes, 2597 passes, 7 skips,
  # 25 min 44 s -- et la mesure a ete prise PENDANT que le harnais de mutation tournait, donc c'est
  # un MAJORANT. ⚠️ Une premiere mesure du 2026-09-08 avait rendu 8 h 30 : elle avait ete prise
  # pendant que seize agents tournaient sur la meme machine. Un chiffre de cout se mesure sur une
  # machine dont on connait la charge, sinon c'est la classe E12 appliquee au cout -- et ici elle
  # INVERSAIT la decision (« impossible en CI » devient « 26 minutes »).
  #
  # `--timeout=900` par test (pytest-timeout) : une simulation qui pend ne doit pas manger le job.
  # ------------------------------------------------------------------------------------------------
  suite-complete:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-timeout
      # ⚠️ `--continue-on-collection-errors` (2026-09-26). Sans lui, UNE erreur de collecte interrompt la session
      # AVANT le premier test : « Interrupted: 8 errors during collection » — 8 modules qui importaient torch
      # sans `importorskip` (torch n'est pas dans requirements.txt) ont rendu ce job rouge SANS EXÉCUTER UN SEUL
      # des 2951 tests collectés (compte local, torch rendu inimportable), pendant ~10 jours, et rien ne
      # distinguait ce rouge d'un rouge de test (mesuré par agagi-00, run 36154477100 : E22 appliqué à la CI).
      # Avec le drapeau, une erreur de collecte reste une ERREUR (job rouge), mais la suite TOURNE et rapporte.
      - name: Suite COMPLETE (repertoire, pas liste nommee)
        run: >-
          PYTHONIOENCODING=utf-8 PYTHONPATH=. python -m pytest tests/ -q --timeout=900 -p no:cacheprovider
          --continue-on-collection-errors

  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r backend/requirements.txt

      - name: Run Python tests
        run: >-
          python -m pytest
          tests/test_backend.py
          tests/sandbox/test_visualization.py
          tests/test_observability.py
          tests/test_flatland_manager.py
          tests/test_strategy.py
          tests/test_sociologist.py
          tests/test_sandbox.py
          tests/test_security.py
          -q

      - name: Parity gate (narration EDR -> frontend)
        run: python tools/parity_check.py --strict

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: API types à jour (codegen OpenAPI -> TS)
        run: |
          PYTHONPATH=. python tools/dump_openapi.py
          npm --prefix frontend run gen:api
          git diff --exit-code -- frontend/openapi.json frontend/src/api/schema.ts

      - name: Run frontend unit tests
        run: npm run test
        working-directory: frontend

      - name: Run frontend build
        run: npm run build
        working-directory: frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend docker image
        run: docker build -f Dockerfile.backend -t agiseed-backend .

      - name: Build frontend docker image
        run: docker build -f Dockerfile.frontend -t agiseed-frontend .

      - name: Run docker compose and smoke test
        run: |
          docker compose up -d
          sleep 10
          curl --fail http://localhost:8000/health
          curl --fail http://localhost:4173
          # Install Playwright browsers and run E2E tests against the running services
          npm --prefix frontend install
          npm --prefix frontend exec -- playwright install --with-deps chromium
          npm --prefix frontend run test:e2e
          docker compose down

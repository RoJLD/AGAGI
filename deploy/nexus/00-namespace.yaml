# deploy/nexus/00-namespace.yaml — namespace dédié aux runs AGAGI déportés sur le cluster ELYSIUM (nœud nexus).
# GABARIT : __NAMESPACE__ et l'adresse du registre sont rendus depuis la configuration hors dépôt —
#   python -m tools.jobs.remote namespace [--appliquer]
# `kubectl apply -f deploy/nexus/` sur les gabarits BRUTS échoue bruyamment (nom invalide), c'est voulu.
#
# Livrable (1) de la session INFRA-NEXUS (2026-09-26). Rien d'AGAGI ne se crée HORS de ce namespace.
# Normes ELYSIUM appliquées (ELYSIUM gitops/policies/cluster-norms/, relues le 2026-09-26 @ 577fc67f7) :
#   CNCE-1  (Enforce) priorityClassName explicite     → posé par CHAQUE pod (elysium-disposable), rien au namespace
#   CNCE-2  (Audit)   requests + limits               → LimitRange du palier `ml-heavy` (01-limitrange.yaml)
#   CNCE-3  (Enforce) pas de :latest                  → images épinglées par tag immuable (remote.py)
#   CNCE-5  (Audit)   runAsNonRoot                    → runners en 65534 ; seul le build Kaniko est root, annoté
#   CNCE-7  (Audit)   ≥ 1 NetworkPolicy par namespace → default-deny-all (02-networkpolicies.yaml)
#   CNCE-8  (Enforce) labels app.kubernetes.io/name + elysium.io/criticality → posés par chaque Job/pod
#   CNCE-11 (mutate)  TTL des Jobs                    → posé explicitement par chaque Job
#
# Criticité du namespace = `standard` (les PODS, eux, se déclarent disposables : priorityClass elysium-disposable,
# préemptibles, label elysium.io/criticality), comme le README ELYSIUM le prescrit pour elysium-ml (qui porte en fait
# `vital` sur le cluster, relu le 2026-09-28) : label gardé pour les politiques CNCE de priorityClass.
# La DIMENSION ne vient PAS de ce label : la LimitRange effective est ml-heavy (01-limitrange.yaml), posée par
# `python -m tools.jobs.remote namespace --appliquer`, HORS de la boucle manuelle du README des LimitRange ELYSIUM —
# qui saute ce namespace par son NOM (ML_HEAVY_NS="elysium-ml elysium-agagi", PR ELYSIUM #1301), pas par un label.
# Sous un AUTRE nom (clé `namespace` de la configuration), la boucle y reposerait le palier nommé ici (standard, max
# 2 CPU / 4 Gi) : le max le plus restrictif gagnerait, et remote.py, qui LIT les LimitRange à la soumission,
# REFUSERAIT bruyamment tout palier > 4 Gi. Renommer = faire d'abord ajouter le nom à ML_HEAVY_NS côté ELYSIUM.
#
# PAS d'injection linkerd (le label n'est pas posé) : un Job n'a pas à attendre un proxy ; chaque pod
# l'écrit aussi en annotation (linkerd.io/inject: disabled).
apiVersion: v1
kind: Namespace
metadata:
  name: __NAMESPACE__
  labels:
    elysium.io/managed-by: agagi
    elysium.io/source-repo: RoJLD.AGAGI
    elysium.io/default-criticality: standard
    # cnce-12-trust-zone-required (ELYSIUM PR-A secrets-flotte, Audit puis Enforce) : namespace de calcul de
    # Robin, sans état res publica -> personal (elysium-2d, 2026-09-26 ; inscrit dans config/namespace_zones.yaml)
    elysium.io/trust-zone: personal
    # DOCUMENTAIRE : aucune boucle ne lit ce label (le saut de la boucle ELYSIUM tient au NOM) — cf. plus haut
    elysium.io/limitrange-tier: ml-heavy
    elysium.io/owner: agagi
    app.kubernetes.io/part-of: agagi
  annotations:
    elysium.io/purpose: "Runs AGAGI deportes (python -m tools...), un Job par run, sources au sha exact"
    elysium.io/contact: "session AGAGI INFRA-NEXUS ; docs/REF/REF-DEPORT-NEXUS.md du depot AGAGI"
